---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Action Testing'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # Perform setup prior to running test(s)
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'
          persist-credentials: false

      - name: 'Setup static version fixture for testing'
        shell: bash
        run: |
          # Setup static version fixture for testing
          # test-python-project uses dynamic versioning; copy static
          # variation so sed substitution tests have a version line
          cp test-python-project/variations/static-eol.toml \
            test-python-project/pyproject.toml

      # Substitution must succeed, sets exit status if it doesn't
      - name: "Run Action: ${{ github.repository }} [test-python-project]"
        id: substitution
        uses: $/
        with:
          flags: "-i -E"
          regex: 's/^version =.*$/version = "1.0.0"/'
          path: 'test-python-project/pyproject.toml'


      - name: "Validate results of string substitution"
        shell: bash
        env:
          EXIT_STATUS: "${{ steps.substitution.outputs.exit_status }}"
        run: |
          # Validate results of string substitution
          if [ "$EXIT_STATUS" != '0' ]; then
            echo "Error: expected exit_status 0, got '$EXIT_STATUS' ❌"
            exit 1
          fi
          file="test-python-project/pyproject.toml"
          string=$(grep '^version = ' "$file" || true)
          echo "$string"
          if [ "$string" != 'version = "1.0.0"' ]; then
            echo "Error: string substitution failed ❌"
            exit 1
          else
            echo "Version string substitution successful ✅"
          fi

      # Test against a file that doesn't exist
      - name: "Run Action: ${{ github.repository }} [no-file]"
        uses: $/
        id: no-file
        continue-on-error: true
        with:
          flags: "-i -E"
          regex: 's:^version =.*$:version = 0.0.2:'
          path: 'no-file-here'

      - name: "Error if step above did NOT fail"
        if: steps.no-file.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"; exit 1

      # Checkout lftools repository
      - name: "Checkout project repository with dynamic versioning"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'lfit/releng-lftools'
          path: 'releng-lftools'
          persist-credentials: false

      # lftools uses dynamic versioning, so this test fail
      - name: "Run Action: ${{ github.repository }} [exit 1]"
        id: no-substitution
        uses: $/
        continue-on-error: true
        with:
          flags: "-i -E"
          regex: 's/^version =.*$/version = "1.0.0"/;tx;q1;:x'
          path: 'releng-lftools/pyproject.toml'
          debug: true

      - name: "Validate no-substitution failure and exit status"
        shell: bash
        env:
          OUTCOME: "${{ steps.no-substitution.outcome }}"
          EXIT_STATUS: "${{ steps.no-substitution.outputs.exit_status }}"
        run: |
          # Validate no-substitution failure and exit status
          if [ "$OUTCOME" != 'failure' ]; then
            echo "Error: previous test step did NOT fail ❌"; exit 1
          fi
          if [ "$EXIT_STATUS" != '1' ]; then
            echo "Error: expected exit_status 1, got '$EXIT_STATUS' ❌"
            exit 1
          fi
          echo "Failure and exit status validated ✅"

      # lftools uses dynamic versioning, so this test fail
      - name: "Run Action: ${{ github.repository }} [exit 5]"
        id: exit-five
        uses: $/
        continue-on-error: true
        with:
          flags: "-i -E"
          regex: 's/^version =.*$/version = "1.0.0"/;tx;q5;:x'
          path: 'releng-lftools/pyproject.toml'

      - name: "Validate exit-five failure and exit status"
        shell: bash
        env:
          OUTCOME: "${{ steps.exit-five.outcome }}"
          EXIT_STATUS: "${{ steps.exit-five.outputs.exit_status }}"
        run: |
          # Validate exit-five failure and exit status
          if [ "$OUTCOME" != 'failure' ]; then
            echo "Error: previous test step did NOT fail ❌"; exit 1
          fi
          if [ "$EXIT_STATUS" != '5' ]; then
            echo "Error: expected exit_status 5, got '$EXIT_STATUS' ❌"
            exit 1
          fi
          echo "Failure and exit status validated ✅"
