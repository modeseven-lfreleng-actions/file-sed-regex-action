---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# file-sed-regex-action
name: 'String Substitution in File (using sed)'
description: 'Performs string substitutions using the command-line tool, sed'

inputs:
  # Mandatory
  flags:
    description: 'Flags to use with SED command'
    required: false
    default: '-i'
  regex:
    description: 'Search/replace expression'
    required: true
  path:
    description: 'Path to local file to modify'
    required: true
  # Optional
  debug:
    description: 'Enable debugging output'
    required: false

outputs:
  exit_status:
    description: 'Exit status of sed command'
    value: ${{ steps.sed.outputs.exit_status }}

runs:
  using: 'composite'
  steps:
    - name: 'Performing string substitution'
      id: sed
      shell: bash
      env:
        INPUT_FLAGS: ${{ inputs.flags }}
        INPUT_REGEX: ${{ inputs.regex }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DEBUG: ${{ inputs.debug }}
      run: |
        # Performing string substitution

        sed_cmd=$(command -v sed || true)
        if [ ! -x "$sed_cmd" ]; then
          echo 'Error: sed command not in PATH ❌'; exit 1
        elif ! ("$sed_cmd" --version 2>&1 | grep -q GNU); then
          echo 'Error: this action only works with GNU sed ❌'; exit 1
        fi

        # The shell-execution mitigation relies on GNU sed's --sandbox mode;
        # fail early with a clear message if this sed is too old to support it
        # (rather than surfacing a confusing "unrecognized option" later).
        if ! "$sed_cmd" --sandbox -n '' </dev/null >/dev/null 2>&1; then
          echo 'Error: this GNU sed does not support --sandbox (needs >= 4.3) ❌'
          exit 1
        fi

        file_path="$INPUT_PATH"
        if [ -z "$file_path" ]; then
          echo 'Error: input variable/path cannot be empty ❌'; exit 1
        elif [ ! -f "$file_path" ]; then
          echo 'Error: file not found ❌'
          echo "Path: $file_path"; exit 1
        fi

        # Run GNU sed in --sandbox mode. This is the robust mitigation for
        # the shell-execution risk: sandbox mode rejects the 'e'/'w'/'r'/'W'/'R'
        # commands and the 's///e' substitution modifier (which execute the
        # pattern space as a shell command or perform arbitrary file I/O),
        # regardless of whether the construct arrives via INPUT_REGEX or
        # INPUT_FLAGS. Unlike a flag denylist it does not break the legitimate
        # '-e' option used to supply an expression.
        #
        # Pass the expression via -e and terminate options with -- so an
        # expression or path beginning with '-' cannot be parsed as an option,
        # and an '-e' in the flags cannot turn the expression into a filename.
        # Drop standalone '--' tokens (supplied below), and a trailing '-e' or
        # '--expression', which previously consumed the positional expression.
        # Split flags on any whitespace, newlines included, as the previous
        # unquoted expansion did; read returns 1 at end of input.
        read -r -d '' -a raw_flags <<< "$INPUT_FLAGS" || true
        sed_flags=()
        for sf in "${raw_flags[@]}"; do
          [ "$sf" = '--' ] && continue
          sed_flags+=("$sf")
        done
        # Non-negative index: negative subscripts need bash >= 4.3
        last=$(( ${#sed_flags[@]} - 1 ))
        if [ "$last" -ge 0 ]; then
          case "${sed_flags[last]}" in
            -e|--expression) unset "sed_flags[last]" ;;
          esac
        fi
        sed_args=(--sandbox "${sed_flags[@]}" -e "$INPUT_REGEX" -- "$file_path")
        if [ "f$INPUT_DEBUG" = 'ftrue' ]; then
          # Print a shell-escaped representation of the real argument vector;
          # %q makes control characters visible.
          printf 'sed'
          printf ' %q' "${sed_args[@]}"
          printf '\n'
        fi
        exit_status=0
        "$sed_cmd" "${sed_args[@]}" || exit_status="$?"
        echo "exit_status=$exit_status" >> "$GITHUB_OUTPUT"
        if [ "$exit_status" != '0' ]; then
          echo "Error: sed command failed with exit status $exit_status ❌"
          exit "$exit_status"
        else
          echo 'Successful sed command/operation ✅'
        fi
